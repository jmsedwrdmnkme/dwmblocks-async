name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: UtkarshVerma/dwmblocks-async
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Optional PAT with `repo` + `workflow` scopes; needed only if
          # upstream changes files under .github/workflows.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Check for new upstream commits
        id: check
        run: |
          base="${{ github.event.repository.default_branch }}"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "origin/${base}"; then
            echo "Already up to date with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commits:"
            git log --oneline "origin/${base}..upstream/${UPSTREAM_BRANCH}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.check.outputs.changed == 'true'
        run: git push --force origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${SYNC_BRANCH}"

      - name: Open pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          BASE: ${{ steps.check.outputs.base }}
        run: |
          existing=$(gh pr list --head "${SYNC_BRANCH}" --base "${BASE}" --state open --json number --jq '.[0].number')
          if [ -n "${existing}" ]; then
            echo "PR #${existing} already open; branch updated."
            exit 0
          fi

          {
            echo "Automated sync of \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` into \`${BASE}\`."
            echo
            echo "### New upstream commits"
            echo
            git log --format='- %h %s' "origin/${BASE}..upstream/${UPSTREAM_BRANCH}"
          } > pr-body.md

          gh pr create \
            --head "${SYNC_BRANCH}" \
            --base "${BASE}" \
            --title "Sync with upstream ${UPSTREAM_REPO}" \
            --body-file pr-body.md
